<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var arr=[1,2,3,4,5];
        var fact,i;
        function factorial(no)
        {
            fact=1
            for(i=1;i<=no;i++)
        {
            fact=fact*i;
        }
        return fact;
        }
        var result=arr.map((n)=>factorial(n));
        document.write("<br> factorial:"+result);


        function cube(no)
        {
            return no**3;
        }
        var result=arr.map((no)=>cube(no));
        document.write("<br> cube:"+result);
        </script>

</body>
</html>

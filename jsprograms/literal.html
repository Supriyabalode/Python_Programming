<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //literal 
        var a=10
        document.write(`value of a is ${a}`);
        document.write("<br>");
// spread opr..
        var fruits=["apple","banana","orange"];
        var vegetables=["potato","tomato",...fruits];
        document.write(vegetables);

        var marks=[45,67,8,9,87,68,89];
        var result=Math.max(...marks);
        document.write("<br> max number from array: "+result);



        // default parameter....

        function show(name="abhay",age=25)
        {
            alert("name of student is " +name+ " and age is " +age);
        }
        show();
        show("meena",25);

        //rest parameters

        function add(a,...b)
        {
            var sum=0;
            sum=sum+a;
            for(var i of b)
        {
            sum=sum+i;
        }
        alert(`sum is ${sum}`);
        }
        add(1,2,3,4,5)
        </script>

    
    
</body>
</html>

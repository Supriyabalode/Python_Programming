<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="result"></p>
    <script>
        function show()
        {
            var now=new Date();
            document.getElementById("result").innerText="current date and time is "+now;
            
        }
        setTimeout(show,3000);
        setInterval(show,5000);
        </script>
    
</body>
</html>

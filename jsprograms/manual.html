<!-- Create an array of student marks: [45, 67, 89, 32, 77]
Use map() to add 5 bonus marks to each student’s score.
Print the new array.  

Task 2: 
Given an array of ages: [12, 18, 20, 15, 25, 30]
Use filter() to extract only ages 18 and above.

Task 3:   
Given an array of product prices: [120, 300, 150, 80, 200]
Use map() to apply a 10% discount to each product
Use filter() to keep only products with final price >= 100
Use reduce() to get the total discounted price
Print all three steps -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var marks=[45,67,89,32,77];
        function bonus(i)
        {
            i=i+5;
            return i;
        }
        var result=marks.map((i)=>bonus(i));
        document.write("<br>marks after adding  5 bonus marks: "+result);



        var ages=[12,18,20,15,25,30];
        var result=ages.filter((i)=>i>=18);
        document.write("<br> ages greater than or equal to 18 using filter function: "+result);



        var price=[120, 300, 150, 80, 200];
       
        var Total=price.map((i)=>i=i-(i*0.10));
        document.write("<br> price after 10 % discount: "+Total);
        
        var abc=Total.filter((i)=>i>=100);
        document.write("<br> price greater than 100 using filter function: "+abc);

       var Totaldisc=price.reduce((sum,i)=>sum=sum+(i*0.10),0);
       document.write("<br> total discount using reduce function: "+Totaldisc);


        
        
        

    
        </script>
</body>
</html>

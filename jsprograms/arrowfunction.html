<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var sqr=(no)=>
    {
        return no*no
    }
    document.write("square of number:"+sqr(5));
    var factorial=(no)=>
    {
        var i,fact=1;
        for(i=1;i<=no;i++)
    {
        fact=fact*i;
    }
        return fact;
    }
    document.write("<br>factorial of number:"+factorial(5));
    



    var maxno=(a,b)=>
    {
        if(a>b)
    {
        document.write("<br>"+a+ " is max");
    }
    else
    {
        document.write("<br>"+b+ " is max");
    }
    }
    maxno(2,3);

    

        </script>
</body>
</html>

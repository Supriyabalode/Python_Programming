<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       var student=[1,"ram","java"];
       var i;
       for(i=0;i<student.length;i++)
       {
        document.write("<br>"+student[i]);
       }

       // for-of
       document.write("<br>output of for-of loop")
       for(var stud of student)
       {
        document.write("<br>"+stud);
       }


       // for in loop         
       document.write("<br> output of for in loop...")
       for(var s in student)
       {
        document.write("<br>"+student[s])
       }



       var marks=[10,20,30,40,50];
       var sum=0;
       for(var i of marks)
       {
        sum=sum+i
       }
       document.write("<br> sum of marks: "+sum);
        </script>
</body>
</html>
